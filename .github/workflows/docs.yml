# Сборка сайта документации (VitePress) и публикация на GitHub Pages.
# Вызывается в конце обычного релиза. Тестовая подпись сайт не обновляет.
name: Docs

on:
  workflow_call:
    inputs:
      ref:
        description: Коммит релиза
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменяем запущенный деплой, чтобы не оставить Pages в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Установить Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Установить зависимости
        run: npm ci

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Собрать сайт
        run: npm run docs:build

      - name: Загрузить артефакт сайта
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
